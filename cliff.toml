# git-cliff configuration for conventional commits changelog
# https://git-cliff.org

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% macro remote_url() %}https://github.com/elioetibr/rust-yaml{% endmacro %}\
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif %}\
            {% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){%- endif %}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% macro remote_url() %}https://github.com/elioetibr/rust-yaml{% endmacro %}\
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous.version -%}
[unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Release tags: `vX.Y.Z` and `vX.Y.Z-N`, where N is the commits-since-source
# counter that `mise run version:tag` derives from GitVersion's SemVer (v1.2.0-42).
#
# The `-N` group is OPTIONAL, and that is the load-bearing part: every tag
# released so far is bare (v1.1.0 back to v0.0.1). A pattern accepting only the
# `-N` form matches exactly one tag in this repository and silently drops all
# fourteen historical sections from the changelog.
#
# The counter is restricted to DIGITS rather than any prerelease identifier.
# Off the default branch GitVersion labels with the branch name, so
# `version:tag` yields `v1.2.0-fix-tool-chains.1`; accepting that shape would
# turn every tagged feature branch into its own release section. Floating
# pointer tags (v0, v0.0, v1, v1.0) stay excluded by the three required
# components.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9]+.*)?$"
filter_unconventional = false
split_commits = false
# Kept in sync with changelog-configuration.json (mikepenz) — same emoji,
# title, and ordering so first-release (git-cliff) and subsequent-release
# (mikepenz) changelogs read identically. The `<!-- NN -->` prefixes set the
# section order (two-digit => lexical sort == numeric); the body template
# strips them via `striptags`. Parser order is first-match-wins, so the
# `chore(release)` skip and `chore(deps)` rule precede the catch-all `chore`.
# >>> commit-config:parsers (generated from commit-types.toml -- do not edit) >>>
commit_parsers = [
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { message = "^init", group = "<!-- 7 -->🎉 Repository Initialization" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# <<< commit-config:parsers <<<
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "elioetibr"
repo = "rust-yaml"
