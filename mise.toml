[tasks."commit:lint"]
alias = ["commit-lint", "lint:commit"]
description = "Validate a commit message against committed.toml. Usage: mise run commit:lint --commit-file <path>, or MSG='feat: x' mise run commit:lint"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
flag "--commit-file <path>" help="path to a commit-message file (what the commit-msg hook passes)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# Two call sites: the hk commit-msg hook passes --commit-file, and a human
# testing a message passes MSG=. Reading the file directly (rather than piping)
# keeps committed's line/column diagnostics pointing at the real file.
if [ -n "${usage_commit_file:-}" ]; then
    committed --commit-file "$usage_commit_file"
    exit 0
fi

msg="${MSG:-}"
if [ -z "$msg" ]; then
    echo "Usage: mise run commit:lint --commit-file <path>" >&2
    echo "   or: MSG='feat: add new feature' mise run commit:lint" >&2
    exit 1
fi
printf '%s\n' "$msg" | committed --commit-file -
echo "✅ Commit message format is valid"
'''

