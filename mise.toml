🚀 Manual Release Process

  1. Bump `version` in Cargo.toml (the anchor)
  2. Run: mise run version:sync      # propagates to src/version.rs, GitVersion.yml
  3. Run: mise run release:check     # full gate + drift check
  4. Run: mise run changelog         # regenerate CHANGELOG.md from cliff.toml
  5. Commit:  git commit -S -m 'chore: release version X.Y.Z [skip ci]'
  6. Tag:     git tag vX.Y.Z
  7. Push:    git push origin main && git push origin vX.Y.Z

💡 Or use the GitHub Actions 'Manual Version Bump' workflow.
EOF
'''

