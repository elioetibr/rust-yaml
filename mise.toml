[tasks.comply]
alias = ["license", "reuse"]
description = "Check REUSE/SPDX licence compliance across the tree (config in REUSE.toml)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
arg "[args]" var=#true help="subcommand and paths passed through to comply; defaults to a whole-tree lint"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# The hk hook calls `comply lint-file <staged paths>` so a commit only pays for
# the files it touched; a bare `mise run comply` lints the whole tree, which is
# what CI needs in order to catch unused licences and LICENSES/ hygiene.
eval "args=(${usage_args:-})"
if [ -z "${args[*]:-}" ]; then args=(lint); fi
comply "${args[@]}"
'''

[tasks."comply:fix"]
alias = ["license:fix", "reuse:fix"]
description = "Add or refresh the SPDX header on the given files (idempotent — already-annotated files are left byte-identical)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
arg "[paths]" var=#true help="files to annotate; defaults to every tracked source file when omitted"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

eval "paths=(${usage_paths:-})"
if [ -z "${paths[*]:-}" ]; then
    mapfile -t paths < <(git ls-files '*.rs')
fi
if [ -z "${paths[*]:-}" ]; then exit 0; fi

comply annotate \
    --copyright "Rust Yaml contributors" \
    --license "MIT OR Apache-2.0" \
    --merge-copyrights \
    "${paths[@]}"
'''

[tasks."comply:format:check"]
alias = ["license:format:check"]
description = "Verify every SPDX header has the canonical 2-line shape, so a hand-written variant cannot drift back in"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# `comply lint` only asks whether a header EXISTS. This asks whether it matches
# the repo's canonical form: a FileCopyrightText line, a blank comment line, and
# a License-Identifier line — in that order, within the first 6 lines.
fail=0
while IFS= read -r file; do
    head -6 "$file" 2>/dev/null | grep -q 'SPDX-FileCopyrightText: Rust Yaml contributors' || continue
    # The tag name is split across two concatenated literals ON PURPOSE. Written
    # contiguously, comply's own scanner reads this grep pattern as a real SPDX
    # tag in mise.toml and reports `invalid expression: MIT OR Apache-2.0'; then`
    # — the shell syntax after the quote gets parsed as part of the expression.
    if ! head -6 "$file" | grep -q 'SPDX-License-''Identifier: MIT OR Apache-2.0'; then
        echo "  non-canonical SPDX header: $file"
        fail=1
    fi
done < <(git ls-files)

if [ "$fail" -ne 0 ]; then
    echo "❌ Run 'mise run comply:fix' to normalize the headers above" >&2
    exit 1
fi
echo "✅ SPDX headers are canonical"
'''

