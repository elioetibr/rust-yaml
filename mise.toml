'''

[tasks."version:read"]
alias = ["version:current"]
description = "Print the crate version declared in Cargo.toml (the anchor every other file restates)"
hide = true
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# [workspace.package] carries the version; stop at the first match so a
# dependency's `version = ` line can never be mistaken for the crate's.
grep -m1 -E '^version = "' Cargo.toml | sed -E 's/version = "(.*)"/\1/'
'''

[tasks."version:check"]
alias = ["ver:check"]
description = "Fail if any file that restates the crate version has drifted from Cargo.toml (the anchor)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# Cargo.toml is the anchor. Drift arrives from either direction: the anchor moves
# and a restatement is forgotten, or a restatement is hand-edited on its own.
# GitVersion's computed SemVer is deliberately NOT compared here — it carries
# CommitsSinceVersionSource and so advances on every commit, which no committed
# file can be gated against; only its `next-version` anchor is.
#
# src/version.rs is deliberately NOT checked: despite what CLAUDE.md says, it
# holds `YamlVersion` (the YAML *spec* version, 1.1 vs 1.2) and carries no crate
# version at all. The crate version reaches the code via CARGO_PKG_VERSION.
anchor="$(mise run version:read)"
fail=0

check() {
    local label="$1" found="$2"
    if [ "$found" != "$anchor" ]; then
        echo "  ❌ $label: $found (expected $anchor)"
        fail=1
    else
        echo "  ✅ $label: $found"
    fi
}

echo "📋 Version anchor (Cargo.toml): $anchor"
if [ -f GitVersion.yml ]; then
    check "GitVersion.yml" "$(grep 'next-version:' GitVersion.yml | sed -E 's/.*next-version: *"?([^"]*)"?.*/\1/')"
fi

if [ "$fail" -ne 0 ]; then
    echo "❌ Version drift detected — run 'mise run version:sync'" >&2
    exit 1
fi
echo "✅ All version restatements match the anchor"
'''

[tasks."version:sync"]
alias = ["ver:sync"]
description = "Rewrite every file that restates the crate version to match Cargo.toml. Cargo.lock is cargo's to own — run a cargo command afterwards"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

anchor="$(mise run version:read)"
echo "📋 Syncing every restatement to $anchor"

# BSD sed (macOS) requires an argument to -i; GNU sed treats it as the suffix.
# `-i.bak` + rm is the only spelling both accept.
if [ -f GitVersion.yml ]; then
    sed -i.bak -E "s/(next-version: *\"?)[0-9]+\.[0-9]+\.[0-9]+(\"?)/\1$anchor\2/" GitVersion.yml && rm -f GitVersion.yml.bak
fi

# Cargo owns Cargo.lock; refresh it here rather than editing it by hand, or the
# cargo:lock:check gate fails on the very commit that bumped the version.
cargo metadata --format-version 1 >/dev/null
echo "✅ Versions synced — review the diff before committing"
'''

