[tasks.yamllint]
alias = ["yaml:lint"]
description = "Lint YAML with yamllint-rs (config in .yamllint)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
arg "[paths]" var=#true help="paths to lint; defaults to the whole repo when omitted"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# `-c` is passed even though `.yamllint` is the one name yamllint-rs discovers,
# because discovery walks up from the process CWD all the way to the filesystem
# root: a stray ~/.yamllint would otherwise win when the task is invoked from
# somewhere unexpected. Naming it explicitly pins the config to this repo's.
#
# Passing paths is likewise mandatory — invoked with zero file arguments the
# binary prints a greeting and exits 0, which would turn this gate into a no-op.
#
# The default is an explicit file list rather than `-r .`, because recursion does
# NOT descend into dot-directories: `yamllint-rs -r .` finds 5 files here and
# silently skips all of .github/ — every workflow, action and issue template.
# Enumerating from git is both complete and automatically excludes the
# yaml-test-suite submodule (a gitlink, so ls-files never walks into it).
#
# There is no --strict: yamllint-rs already exits 1 on any finding, warnings
# included.
eval "paths=(${usage_paths:-})"
if [ -z "${paths[*]:-}" ]; then
    # --cached lists the index, which still names files deleted from the working
    # tree, and yamllint-rs aborts the whole run on the first missing path — so
    # the list is filtered to what actually exists on disk.
    mapfile -t tracked < <(git ls-files --cached --others --exclude-standard '*.yml' '*.yaml')
    paths=()
    for f in "${tracked[@]}"; do
        [ -f "$f" ] && paths+=("$f")
    done
fi
if [ -z "${paths[*]:-}" ]; then exit 0; fi
yamllint-rs -c .yamllint "${paths[@]}"
'''

[tasks."yamllint:fix"]
alias = ["yaml:fix"]
description = "Auto-fix the YAML issues yamllint-rs can repair, then re-lint the result"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
arg "[paths]" var=#true help="paths to fix; defaults to every tracked YAML file when omitted"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# yamllint-rs ships a native --fix, so no external formatter is involved. Only a
# subset of rules is fixable, hence the re-lint below: --fix exits 0 having
# repaired what it could, and the second pass is what actually gates.
eval "paths=(${usage_paths:-})"
if [ -z "${paths[*]:-}" ]; then
    # --cached lists the index, which still names files deleted from the working
    # tree, and yamllint-rs aborts the whole run on the first missing path — so
    # the list is filtered to what actually exists on disk.
    mapfile -t tracked < <(git ls-files --cached --others --exclude-standard '*.yml' '*.yaml')
    paths=()
    for f in "${tracked[@]}"; do
        [ -f "$f" ] && paths+=("$f")
    done
fi
if [ -z "${paths[*]:-}" ]; then exit 0; fi

yamllint-rs -c .yamllint --fix "${paths[@]}"
yamllint-rs -c .yamllint "${paths[@]}"
'''

