# mise — single source of truth for rust-yaml's tool pins and tasks.
# =================================================================
# `mise` (https://mise.jdx.dev) is the task runner AND tool manager; it replaced
# the legacy GNU Makefile. Run `mise run <task>`, never `make <target>`.
#
# Conventions every task follows (see the project standards):
#   * `alias` list, so each task has a short name that collides with nothing.
#   * `description`, so `mise tasks` is self-documenting.
#   * TOML *literal* strings (''' … ''') for multi-line `run` bodies — never
#     basic ("""). Literal strings pass backslashes through untouched, which the
#     embedded sed/awk regexes require.
#   * `shell = "bash -c"` plus a `#!/usr/bin/env bash` shebang, so the block runs
#     under real bash rather than the default `sh`.
#   * `set -Eeuo pipefail` — abort on error (-e), inherit ERR traps into
#     functions and subshells (-E), abort on unset vars (-u), and propagate
#     failures through pipes (pipefail).
#   * A `usage` block exposing at least `--verbose` for debugging.
#   * `task:subcommand` naming once a task grows subcommands.
#
# Files: commit `mise.toml` and `mise.lock`. `mise.local.toml` is generated by
# `mise run setup` and is machine-specific — it is git-ignored, never committed.
#
# Usage:  mise run <task>   (e.g. `mise run ci`, `mise run test`)
#         mise tasks        (list everything)

min_version = "2024.1.0"

[settings]
color = true
experimental = true
idiomatic_version_file = true
# Let mise read the Rust channel and components from rust-toolchain.toml, so that
# file stays the single source of truth and cannot drift from this one. There is
# no package.json in this repo, so `node` is deliberately not enabled.
idiomatic_version_file_enable_tools = ["rust"]
legacy_version_file = false
lockfile = true
not_found_auto_install = true
quiet = true

[tools]
# rust is provisioned from rust-toolchain.toml via [settings] above — no version
# is repeated here, keeping rust-toolchain.toml the single source of truth.
"cargo:cargo-audit" = "0.22.1"
"cargo:cargo-criterion" = "1.1.0"
"cargo:cargo-deny" = "0.19.8"
"cargo:cargo-fuzz" = "0.13.1"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-nextest" = "0.9.137"
"cargo:cargo-pgo" = "0.3.0"
"cargo:cargo-semver-checks" = "0.48.0"
"cargo:cargo-sort" = "2.1.4"
"cargo:cargo-tarpaulin" = "0.35.4"
"cargo:cargo-wizard" = "0.2.3"
"cargo:committed" = "1.1.11"
# REUSE/SPDX compliance checker; reads REUSE.toml (including its [tool.comply]
# section). Owns the licence-header invariant that `mise run comply` gates on.
"cargo:comply" = "0.1.0-9"
"cargo:flamegraph" = "0.6.12"
# Markdown linter written in Rust; auto-discovers .rumdl.toml. Replaces
# .markdownlint.json and the ~110 lines of hand-rolled awk that only ever
# implemented MD022/MD031/MD032.
"cargo:rumdl" = "0.2.48"
# YAML linter written in Rust. Installs a binary named `yamllint-rs`, NOT
# `yamllint`, and auto-discovers only the extensionless `.yamllint` — which is
# why the config carries that exact name. See .yamllint.
"cargo:yamllint-rs" = "0.1.4"
actionlint = "1.7.12"
# Runtime for the VitePress documentation site in docs/. The pin must equal
# docs/.bun-version, which is what oven-sh/setup-bun reads in docs.yml — the two
# are the same version expressed for two different installers, so bump together
# or CI and local builds run on different bun releases.
bun = "1.3.14"
git-cliff = "2.13.1"
gitleaks = "8.30.1"
# aqua ships hk for darwin/arm64 but not darwin/amd64, so macOS is narrowed to
# arm64 with the compound "<os>/<arch>" form — mise parses both halves, and this
# is the whole platform gate. The separate `arch` key does NOT filter (verified:
# arch = ["ppc64"] still resolves on an x64 host); it documents intent only.
#
# On an Intel Mac this gate skips aqua entirely, which is why `hk` is listed in
# the setup task's BREW_TOOLS below: Homebrew ships a bottled hk for darwin/amd64
# and is the only route to it there. The pin matches the Config.pkl version that
# hk.pkl amends — bump both together or hk rejects the config.
"aqua:hk" = { version = "1.54.0", os = [
  "linux",
  "windows",
  "macos/arm64",
], arch = [
  "arm64",
  "x64",
], locked = false }
"pipx:codecov-cli" = "11.2.8"
# taplo: general-purpose TOML formatter + linter (aqua ships a prebuilt binary).
# Pairs with cargo-sort — taplo owns TOML *formatting*, cargo-sort owns Cargo.toml
# dependency *ordering* (taplo deliberately does not reorder keys).
taplo = "0.10.0"

[env]
ARCH = "{{exec(command='uname -m')}}"

# Name the project after the git remote, falling back to the directory.
# `$PWD` is wrong here: run mise from a subdirectory and the project renames
# itself. Tera cannot nest `{{ }}` inside `{{ exec(...) }}`, so config_root is
# spliced in with the `~` concatenation operator. The fallback must sit INSIDE
# the command substitution -- written as `basename $(git ...) .git || <fb>`,
# an empty remote makes basename fail on missing operands and the fallback
# then yields a full path rather than a basename. A TOML multi-line literal
# (''') avoids escaping the double quotes the shell needs.
PROJECT_NAME = '''{{ exec(command='basename "$(git config --get remote.origin.url || echo ' ~ config_root ~ ')" .git') }}'''

[hooks]
postinstall = '''
echo "Installed: $MISE_INSTALLED_TOOLS"
'''

# cargo backs every "cargo:*" pin above, so it must be resolvable before mise
# tries to build them. pipx does the same for the "pipx:*" pins.
[deps.bun]
auto = true

[deps.cargo]
auto = true

[deps.pipx]
auto = true

# ============================================================================
# Tool installation & environment
# ============================================================================

[tasks.setup]
alias = ["install", "dev", "dev:setup", "dev:up"]
description = "Install tools, sourcing from Homebrew when it matches the pin"
depends_post = ["submodules", "hooks:install"]
run = '''
set -eo pipefail

# Homebrew is preferred on macOS when present, but ONLY for a tool whose
# installed version already equals the pin in [tools] above. None of these ship
# a versioned formula (there is no taplo@0.10.0), so brew tracks whatever is
# current — honouring it blindly would silently break the pinning this file
# exists to guarantee. On any mismatch the pin wins and mise installs the tool.
#
# `hk` is the exception that makes this machinery load-bearing rather than a
# nicety: aqua publishes no darwin/amd64 build, so on an Intel Mac the [tools]
# gate above skips it and Homebrew's bottle is the ONLY way to get it.
#
# Formula names only; versions are read back from [tools] so mise.toml stays the
# single source of truth.
BREW_TOOLS="actionlint git-cliff gitleaks gh hk jq rustup taplo uv yq"

root="$(git rev-parse --show-toplevel)"
local_cfg="$root/mise.local.toml"

# An empty MISE_DISABLE_TOOLS overrides whatever mise.local.toml sets, so the
# lockfile is always written from the FULL toolset. A disabled tool is omitted
# from mise.lock entirely, and a brew machine committing such a lockfile would
# leave non-brew machines unresolvable. This is why locking no longer needs to
# delete the local config first.
MISE_DISABLE_TOOLS= mise lock

have_brew=no
if [ "$(uname -s)" = "Darwin" ] && command -v brew >/dev/null 2>&1; then
  have_brew=yes
fi

# One batched call: separate `brew list` invocations cost roughly 5x more.
brew_versions() {
  [ "$have_brew" = yes ] || return 0
  brew list --versions $BREW_TOOLS 2>/dev/null | sort || true
}

# `mise ls --current` merges the global config, so intersecting with BREW_TOOLS
# below keeps this to the project's own tools.
pins="$(MISE_DISABLE_TOOLS= mise ls --current --json | jq -r 'to_entries[] | "\(.key) \(.value[0].requested_version)"' | sort)"

# Fingerprint every input that decides this file's content. Hashing mise.lock
# alone is NOT sufficient: Homebrew moving taplo 0.10.0 -> 0.11.0 must force a
# rewrite, and nothing about that touches the lockfile.
fingerprint() {
  printf '%s\n' \
    "v1" "$(uname -s)" "$(uname -m)" "$have_brew" "$pins" "$(brew_versions)" \
    "$(shasum -a 256 "$root/mise.lock" 2>/dev/null | cut -d" " -f1)" \
    | shasum -a 256 | cut -d" " -f1
}

# `mise install` can settle new entries into mise.lock — a first-time install of
# a version, or a tool added since the last lock — which leaves the fingerprint
# just written already stale and costs one redundant rebuild on the next run.
# Re-stamping afterwards makes the cache converge in a single run.
refresh_fp() {
  [ -f "$local_cfg" ] || return 0
  local now tmp
  now="$(fingerprint)"
  if grep -qF "# fingerprint: $now" "$local_cfg"; then
    return 0
  fi
  tmp="$(mktemp)"
  awk -v fp="$now" '/^# fingerprint: /{ print "# fingerprint: " fp; next } { print }' "$local_cfg" > "$tmp"
  mv "$tmp" "$local_cfg"
}

fp="$(fingerprint)"
if [ -f "$local_cfg" ] && grep -qF "# fingerprint: $fp" "$local_cfg"; then
  echo "mise.local.toml up to date ($(printf '%s' "$fp" | cut -c1-12))"
  mise install
  mise deps
  refresh_fp
  exit 0
fi

lookup() { printf '%s\n' "$2" | awk -v t="$1" '$1 == t { print $2 }'; }

brewed=""
installed_any=no
if [ "$have_brew" = yes ]; then
  state="$(brew_versions)"
  missing=""

  for f in $BREW_TOOLS; do
    pin="$(lookup "$f" "$pins")"
    [ -n "$pin" ] || continue
    inst="$(lookup "$f" "$state")"

    if [ -z "$inst" ]; then
      missing="$missing $f"
    elif [ "$pin" = "latest" ] || [ "$pin" = "$inst" ]; then
      brewed="$brewed $f"
      echo "brew $f $inst"
    else
      echo "mise $f $pin (Homebrew has $inst)"
    fi
  done

  # Only tools that are not installed yet need the slow formula API, and they
  # are queried in a single batched call.
  if [ -n "$missing" ]; then
    stables="$(brew info --json=v2 $missing 2>/dev/null | jq -r '.formulae[] | "\(.name) \(.versions.stable)"' || true)"
    for f in $missing; do
      pin="$(lookup "$f" "$pins")"
      stable="$(lookup "$f" "$stables")"
      if [ -n "$stable" ] && { [ "$pin" = "latest" ] || [ "$pin" = "$stable" ]; }; then
        brew install "$f"
        brewed="$brewed $f"
        installed_any=yes
        echo "brew $f $stable (installed)"
      else
        echo "mise $f $pin${stable:+ (Homebrew has $stable)}"
      fi
    done
  fi
fi

# Installing changed what brew reports, so the fingerprint must be recomputed or
# the next run would see a mismatch and redo all of this for nothing.
[ "$installed_any" = yes ] && fp="$(fingerprint)"

# disable_tools makes mise step aside so its shims stop shadowing Homebrew's
# bin. Machine-specific, hence mise.local.toml rather than mise.toml.
{
  echo "# Generated by \`mise run install\` - machine-specific, not committed."
  echo "# fingerprint: $fp"
  if [ -n "$brewed" ]; then
    echo "# Tools Homebrew satisfies at the pinned version; mise handles the rest."
    echo "[settings]"
    printf 'disable_tools = ['
    sep=""
    for f in $brewed; do
      printf '%s"%s"' "$sep" "$f"
      sep=", "
    done
    printf ']\n'
  fi
  # No [tools] section is emitted here: platform gating belongs in mise.toml,
  # where the compound os = [..., "macos/arm64"] form already covers hk. This
  # file is only ever about stepping aside for the system package manager.
} > "$local_cfg"

mise lock
mise install
mise deps
refresh_fp
'''
shell = "bash -c"

[tasks.submodules]
alias = ["git:submodules", "sub"]
description = "Initialize the yaml-test-suite git submodule (yaml-test-suite/data)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

git submodule update --init --recursive --force
'''

[tasks."hooks:install"]
alias = ["hooks", "hk:install"]
description = "Install the git hooks managed by hk (idempotent)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# hk is gated out of [tools] on darwin/amd64 (aqua ships no build); `mise run
# setup` sources it from Homebrew there. Fail with that hint rather than a bare
# "command not found" so the fix is obvious.
if ! command -v hk >/dev/null 2>&1; then
    echo "hk not found. Run 'mise run setup' (Homebrew supplies it on Intel macOS)." >&2
    exit 1
fi
hk install
'''

[tasks."hooks:run"]
alias = ["hk:run", "pre-commit"]
description = "Run the hk pre-commit hook over the whole tree (what CI gates on)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
flag "--fix" help="Apply fixes instead of only reporting them"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

if [ "${usage_fix:-false}" = "true" ]; then
    hk fix --all
else
    hk check --all
fi
'''

[tasks.doctor]
alias = ["diag", "env:doctor"]
description = "Diagnose the toolchain, every mise-provisioned tool, and project state; reports MISSING for anything not installed"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# `v <label> <cmd...>` prints the first line of the tool's version output, or
# MISSING when it is absent (empty stdout). Keeps this in lockstep with [tools] —
# every pinned tool gets exactly one row below.
v() {
    label="$1"
    shift
    out="$("$@" 2>/dev/null | head -1)"
    printf "  %-20s : %s\n" "$label" "${out:-MISSING}"
}

echo "=== Platform: $(uname -s) ($(uname -m)) ==="

echo "-- Rust toolchain (rust-toolchain.toml) --"
v rustc rustc --version
v cargo cargo --version
v rustup rustup --version
v rustfmt rustfmt --version
v clippy cargo clippy --version

echo "-- Cargo tools (mise [tools]) --"
v cargo-audit cargo audit --version
v cargo-criterion cargo criterion --version
v cargo-deny cargo deny --version
v cargo-fuzz cargo fuzz --version
v cargo-machete cargo machete --version
v cargo-mutants cargo mutants --version
v cargo-nextest cargo nextest --version
v cargo-pgo cargo pgo --version
v cargo-semver-checks cargo semver-checks --version
v cargo-sort cargo sort --version
v cargo-tarpaulin cargo tarpaulin --version
v cargo-wizard cargo wizard --version
v cargo-flamegraph cargo flamegraph --version
v committed committed --version
v comply comply --version
v rumdl rumdl --version
v yamllint-rs yamllint-rs --version

echo "-- Lint / hooks / release tools --"
v actionlint actionlint -version
v git-cliff git-cliff --version
v gitleaks gitleaks version
v hk hk --version
v taplo taplo --version

echo "-- Python tools (pipx) --"
v codecov-cli codecovcli --version

echo "-- Meta --"
v mise mise --version

echo "-- Project state --"
printf "  %-20s : %s\n" "hk hooks" "$(test -e .git/hooks/pre-commit && echo installed || echo 'MISSING (mise run hooks:install)')"
printf "  %-20s : %s\n" "yaml-test-suite" "$(test -e yaml-test-suite/data/229Q/in.yaml && echo initialized || echo 'MISSING (mise run submodules)')"
'''

[tasks."debug:env"]
alias = ["debug", "env:debug"]
description = "Show development environment information (versions, git hook wiring)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🔍 Development Environment:"
echo "Rust version: $(rustc --version)"
echo "Cargo version: $(cargo --version)"
if command -v committed >/dev/null; then echo "committed version: $(committed --version)"; fi
echo "Git hooks path: $(git config --get core.hooksPath || echo 'default')"
echo "Commit template: $(git config --get commit.template || echo 'none')"
'''

[tasks.help]
alias = ["tasks", "ls"]
description = "Show available tasks"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Include hidden tasks and full descriptions"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

if [ "${usage_verbose:-false}" = "true" ]; then
    mise tasks ls --hidden
else
    mise tasks ls
fi
'''

[tasks."git:status"]
alias = ["status", "gs"]
description = "Show git status with helpful formatting"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

if [ -z "$(git status --porcelain)" ]; then
    echo "✅ Working directory clean"
else
    echo "📂 Working directory changes:"
    git status --short
fi
'''

# ============================================================================
# Cleaning
# ============================================================================

[tasks.clean]
alias = ["cleanup", "clean:all"]
description = "Clean build artifacts and temporary files"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧹 Cleaning build artifacts..."
cargo clean
rm -f debug_* test_*
rm -f lcov.info cobertura.xml
rm -rf target/tarpaulin target/llvm-cov
find . -name "*.tmp" -delete
echo "✅ Clean complete"
'''

[tasks."coverage:clean"]
alias = ["clean:coverage"]
description = "Clean coverage artifacts only (leaves the cargo build cache intact)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧹 Cleaning coverage artifacts..."
rm -f lcov.info cobertura.xml
rm -rf target/tarpaulin target/llvm-cov
echo "✅ Coverage artifacts cleaned"
'''

# ============================================================================
# Build
# ============================================================================

[tasks.build]
alias = ["b", "build:dev"]
description = "Build the project with default features"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🔨 Building project..."
cargo build
'''

[tasks."build:release"]
alias = ["br", "release:build"]
description = "Build in release mode (LTO + panic=abort, per [profile.release])"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🔨 Building project in release mode..."
timeout 300s cargo build --release
'''

[tasks."build:all-features"]
alias = ["ba", "build:all"]
description = "Build with all features enabled (async, serde, mmap, large-documents)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🔨 Building project with all features..."
cargo build --all-features
'''

[tasks.examples]
alias = ["example", "run:examples"]
description = "Run the library_comparison example"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "💡 Running examples..."
cargo run --example library_comparison
'''

# ============================================================================
# Testing
# ============================================================================

[tasks.test]
alias = ["t"]
description = "Run library unit tests"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧪 Running tests..."
timeout 120s cargo test --lib --verbose
'''

[tasks."test:lib"]
alias = ["tl"]
description = "Run library tests only, without the verbose harness output"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧪 Running library tests..."
timeout 120s cargo test --lib
'''

[tasks."test:release"]
alias = ["tr"]
description = "Run tests in release mode"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧪 Running tests in release mode..."
timeout 300s cargo test --lib --release --verbose
'''

[tasks."test:all-features"]
alias = ["test:all", "ta"]
description = "Run tests with all features enabled"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧪 Running tests with all features..."
timeout 300s cargo test --lib --all-features --verbose
'''

[tasks."test:no-default"]
alias = ["tnd"]
description = "Run tests with no default features (verifies feature gating)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧪 Running tests without default features..."
timeout 300s cargo test --lib --no-default-features --verbose
'''

[tasks."test:nocapture"]
alias = ["test:verbose", "tnc"]
description = "Run tests with stdout capture disabled"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧪 Running tests with output visible..."
timeout 300s cargo test -- --nocapture
'''

[tasks."test:integration"]
alias = ["ti"]
description = "Run integration tests (every tests/*.rs binary)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🧪 Running integration tests..."
# `--tests` auto-discovers every `tests/*.rs` binary, so newly added test files
# (e.g. `tests/directives.rs`) get picked up here without being enumerated.
# Matches what CI / nextest sees end-to-end.
timeout 300s cargo test --tests
'''

[tasks."test:security"]
alias = ["ts", "security"]
description = "Run the security-limit tests that guard the resource caps in src/limits.rs"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

echo "🔒 Running security tests..."
timeout 120s cargo test --test security_limits
timeout 120s cargo test --test security_limits test_nested_alias_expansion_limit
'''

[tasks."test:yaml-suite"]
