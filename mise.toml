[tasks."gitignore:check"]
alias = ["ignorefile:check"]
description = "Validate ignorefile.toml without writing .gitignore (the CI/pre-commit drift guard)"
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# Both sides matter: `validate` catches a malformed ignorefile.toml, and the
# regenerate-and-diff catches a hand-edit of the generated .gitignore, which is
# the direction the drift actually tends to take.
ignorefile validate
before="$(cat .gitignore)"
ignorefile generate >/dev/null
if [ "$before" != "$(cat .gitignore)" ]; then
    printf '%s\n' "$before" > .gitignore
    echo "❌ .gitignore is out of sync with ignorefile.toml — run 'mise run gitignore'" >&2
    exit 1
fi
echo "✅ .gitignore matches ignorefile.toml"
'''

