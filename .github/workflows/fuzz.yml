name: Fuzz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Nightly at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds to run each fuzz target"
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # cargo-fuzz is installed as a prebuilt musl binary, so it auto-detects a
  # musl target — which is not installed and is incompatible with the ASan
  # sanitizer. Pin the host GNU triple for every fuzz invocation.
  FUZZ_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  # Fast compile check on every PR that touches the harness or the library —
  # keeps the targets buildable without spending any fuzzing budget.
  build:
    name: Build fuzz targets
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: elioseverojunior/rust-toolchain@365ab4286518f5f3d13c12ed638024bdc86f413b # v0.3.0-1

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-fuzz

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build --target "$FUZZ_TRIPLE"

  # Scheduled / manual fuzzing run. load_str and load_str_strict are gating;
  # roundtrip is non-blocking until #66 (numeric mapping key) is fixed.
  fuzz:
    name: Run fuzz targets
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      # Captured into an env var here (the safe pattern); steps reference the
      # shell variable $FUZZ_SECONDS, never `${{ }}` interpolation in `run:`.
      FUZZ_SECONDS: ${{ github.event.inputs.duration || '300' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: elioseverojunior/rust-toolchain@365ab4286518f5f3d13c12ed638024bdc86f413b # v0.3.0-1

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-fuzz

      - name: Fuzz load_str
        run: cargo +nightly fuzz run load_str --target "$FUZZ_TRIPLE" -- -max_total_time="$FUZZ_SECONDS"

      - name: Fuzz load_str_strict
        run: cargo +nightly fuzz run load_str_strict --target "$FUZZ_TRIPLE" -- -max_total_time="$FUZZ_SECONDS"

      - name: Fuzz roundtrip (non-blocking — tracks #66)
        continue-on-error: true
        run: cargo +nightly fuzz run roundtrip --target "$FUZZ_TRIPLE" -- -max_total_time="$FUZZ_SECONDS"

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
