name: Publish to crates.io

# This workflow handles publishing to crates.io and creating release artifacts.
# It assumes that tests have already passed (via CI workflow or manual verification).
#
# Triggered by:
# - Creating a GitHub release (automatic)
# - Manual workflow dispatch (for controlled releases)
#
# Note: The CI workflow (ci.yml) handles testing and validation.
# This workflow focuses solely on the publishing process.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Perform a dry run without publishing"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write
  pages: write
  pull-requests: write

jobs:
  validate:
    name: Validate Release
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use PR head SHA on pull_request events to avoid synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          submodules: true

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Version to publish: ${VERSION}"

      - name: Check if should publish
        id: check
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "🔍 Dry run mode - will not publish"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "✅ Will proceed with publishing"
          fi

  publish-crate:
    name: Publish to crates.io
    needs: [validate]
    if: needs.validate.outputs.should_publish == 'true'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: crates-io
    steps:
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use PR head SHA on pull_request events to avoid synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          submodules: true

      - name: GitHub Actions Bot Setup
        uses: ./.github/actions/bot-setup

      - name: Install Rust toolchain
        uses: elioseverojunior/rust-toolchain@365ab4286518f5f3d13c12ed638024bdc86f413b # v0.3.0-1

      - name: Crates.io Authentication
        id: crates-auth
        if: github.event.inputs.dry_run != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Verify package
        run: |
          echo "📦 Verifying package..."
          cargo package --verbose
          cargo package --list

          # Check package size
          PACKAGE_SIZE=$(cargo package --list | wc -l)
          echo "Package contains ${PACKAGE_SIZE} files"

      - name: Check crates.io status
        if: github.event.inputs.dry_run != 'true'
        id: check-crates
        env:
          CRATE_NAME: ${{ vars.CRATE_NAME || github.event.repository.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Check if version already exists
          if cargo search "${CRATE_NAME}" --limit 1 | grep -q "^${CRATE_NAME}.*\"${VERSION}\""; then
            echo "❌ Version ${VERSION} already exists on crates.io"
            exit 1
          else
            echo "✅ Version ${VERSION} is available for publishing"
          fi

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          cargo publish --token "${CARGO_REGISTRY_TOKEN}" --verbose
          echo "🎉 Successfully published version ${{ needs.validate.outputs.version }} to crates.io"

      - name: Verify publication
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Waiting for crates.io to index the new version..."
          sleep 60

          CRATE_NAME="rust-yaml"
          VERSION="${{ needs.validate.outputs.version }}"

          if cargo search "${CRATE_NAME}" --limit 1 | grep -q "^${CRATE_NAME}.*\"${VERSION}\""; then
            echo "✅ Version ${VERSION} is now available on crates.io"
            echo "📚 View at: https://crates.io/crates/${CRATE_NAME}/${VERSION}"
          else
            echo "⚠️ Version not yet indexed, but should appear soon"
          fi

  # Delegates to docs.yml rather than restating the build. The steps this
  # replaced published `target/doc` alone, which would have overwritten the
  # VitePress site with rustdoc-only output on every release -- the two
  # pipelines share one Pages deployment, so whichever ran last won.
  #
  # `cargo set-version` is not carried over: this workflow runs on a published
  # release, so the checked-out tag already carries the released version in
  # Cargo.toml and rustdoc reads it from there.
  publish-docs:
    name: Publish Documentation
    needs: [validate, publish-crate]
    # Deliberately NOT gated on `should_publish`. A dry run sets that to false
    # and skips publish-crate, so gating on it here skipped this job too and the
    # `dry-run` input below became unreachable -- the docs were never built on a
    # dry run, which is the run that most wants to know whether they still build.
    # `!= 'failure'` admits the skipped case; `!cancelled()` keeps a cancelled
    # run from publishing.
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.publish-crate.result != 'failure'
    uses: ./.github/workflows/docs.yml
    with:
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
    # Reusable workflows receive no secrets unless passed. Without this the
    # app-token step sees an empty PRIVATE_KEY; `continue-on-error` keeps the
    # job alive on `github.token`, so the failure would be silent rather than
    # loud -- the docs would still publish, just without the app identity.
    secrets: inherit

  summary:
    name: Publication Summary
    needs: [validate, publish-crate, publish-docs]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CRATE_RESULT: ${{ needs.publish-crate.result }}
          DOCS_RESULT: ${{ needs.publish-docs.result }}
          REPO_OWNER: ${{ github.repository_owner }}
        # A single grouped redirect rather than 26 individual ones (SC2129), with
        # $GITHUB_STEP_SUMMARY quoted (SC2086) and every workflow expression bound
        # through env: instead of spliced into the script text.
        run: |
          {
            echo "# 📦 Publication Summary"
            echo ""
            echo "**Version:** ${VERSION}"
            echo ""

            if [ "${CRATE_RESULT}" = "success" ]; then
              echo "✅ **crates.io:** Successfully published"
              echo "   - View: https://crates.io/crates/rust-yaml/${VERSION}"
            elif [ "${CRATE_RESULT}" = "skipped" ]; then
              echo "⏭️ **crates.io:** Skipped (dry run or already published)"
            else
              echo "❌ **crates.io:** Failed or not completed"
            fi
            echo ""

            if [ "${DOCS_RESULT}" = "success" ]; then
              echo "✅ **Documentation:** Successfully published"
              echo "   - docs.rs: https://docs.rs/rust-yaml/latest"
              echo "   - GitHub Pages: https://${REPO_OWNER}.github.io/rust-yaml/"
            elif [ "${DOCS_RESULT}" = "skipped" ]; then
              echo "⏭️ **Documentation:** Skipped (dry run)"
            else
              echo "❌ **Documentation:** Failed or not completed"
            fi
            echo ""

            echo "## Next Steps"
            echo ""
            echo "1. Verify the crate at: https://crates.io/crates/rust-yaml"
            echo "2. Check documentation at: https://docs.rs/rust-yaml"
            echo "3. Create release notes if not already done"
            echo "4. Announce the release"
          } >> "$GITHUB_STEP_SUMMARY"
