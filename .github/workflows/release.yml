name: Publish to crates.io

# This workflow handles publishing to crates.io and creating release artifacts.
# It assumes that tests have already passed (via CI workflow or manual verification).
#
# Triggered by:
# - Creating a GitHub release (automatic)
# - Manual workflow dispatch (for controlled releases)
#
# Note: The CI workflow (ci.yml) handles testing and validation.
# This workflow focuses solely on the publishing process.

concurrency:
  group: publish-to-crates-io-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Perform a dry run without publishing"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Perform a dry run without publishing"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# `pages: write` is deliberately absent. It was here for a docs job that
# deployed to Pages; that job now only builds an artifact, and gh-pages.yml is
# what publishes the site. `id-token: write` stays -- crates-io-auth-action mints
# an OIDC token for the registry.
# Least privilege at the top; every job that needs more declares it itself.
# A workflow-level write scope is granted to EVERY job, including ones that only
# check out and compile -- so a compromised action in any of them inherits it.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use PR head SHA on pull_request events to avoid synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          submodules: true

      # Every expression reaches the shell through `env:`, never spliced into the
      # script text -- the convention the summary job at the end of this file
      # already documents. A release tag name is pushed input: interpolated with
      # `${{ }}` it is substituted before bash parses a single quote, so a tag
      # containing shell metacharacters would execute here with this job's token.
      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -Eeuo pipefail

          if [ "${EVENT_NAME}" = "release" ]; then
            VERSION="${TAG_NAME#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi

          # Refuse anything that is not SemVer rather than carrying it onward: a
          # floating tag like `v1` or `v1.1` reaches this workflow exactly as a
          # release tag does, and would otherwise flow into `cargo publish` and
          # the crates.io lookup as a version that cannot resolve.
          if ! printf '%s' "${VERSION}" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing '${VERSION}' (event '${EVENT_NAME}'): not a SemVer version."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Version to publish: ${VERSION}"

      - name: Check if should publish
        id: check
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -Eeuo pipefail

          if [ "${DRY_RUN}" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "🔍 Dry run mode - will not publish"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "✅ Will proceed with publishing"
          fi

  publish-crate:
    name: Publish to crates.io
    # `rust-lang/crates-io-auth-action` exchanges an OIDC token for a registry
    # token, which is the only elevated thing this workflow does.
    permissions:
      contents: read
      id-token: write
    needs: [validate]
    if: needs.validate.outputs.should_publish == 'true'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: crates-io
    steps:
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use PR head SHA on pull_request events to avoid synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          submodules: true

      - name: GitHub Actions Bot Setup
        uses: ./.github/actions/bot-setup

      - name: Install Rust toolchain
        uses: elioseverojunior/rust-toolchain@365ab4286518f5f3d13c12ed638024bdc86f413b # v0.3.0-1

      - name: Crates.io Authentication
        id: crates-auth
        if: github.event.inputs.dry_run != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Verify package
        run: |
          echo "📦 Verifying package..."
          cargo package --verbose
          cargo package --list

          # Check package size
          PACKAGE_SIZE=$(cargo package --list | wc -l)
          echo "Package contains ${PACKAGE_SIZE} files"

      - name: Check crates.io status
        if: github.event.inputs.dry_run != 'true'
        id: check-crates
        env:
          CRATES_NAME: ${{ vars.CRATES_NAME || github.event.repository.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Check if version already exists
          if cargo search "${CRATES_NAME}" --limit 1 | grep -q "^${CRATES_NAME}.*\"${VERSION}\""; then
            echo "❌ Version ${VERSION} already exists on crates.io"
            exit 1
          else
            echo "✅ Version ${VERSION} is available for publishing"
          fi

      - name: Publish to crates.io
        if: github.event.inputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -Eeuo pipefail

          cargo publish --token "${CARGO_REGISTRY_TOKEN}" --verbose
          echo "🎉 Successfully published version ${VERSION} to crates.io"

      - name: Verify publication
        if: github.event.inputs.dry_run != 'true'
        # Same env binding as the check step above rather than a second, hardcoded
        # copy of the crate name. The literal that was here would keep saying
        # `rust-yaml` after a rename and report success against a crate nobody
        # published.
        env:
          CRATES_NAME: ${{ vars.CRATES_NAME || github.event.repository.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -Eeuo pipefail

          echo "Waiting for crates.io to index the new version..."
          sleep 60

          if cargo search "${CRATES_NAME}" --limit 1 | grep -q "^${CRATES_NAME}.*\"${VERSION}\""; then
            echo "✅ Version ${VERSION} is now available on crates.io"
            echo "📚 View at: https://crates.io/crates/${CRATES_NAME}/${VERSION}"
          else
            echo "⚠️ Version not yet indexed, but should appear soon"
          fi

  # Builds the API documentation; it does NOT publish. docs.yml stopped
  # deploying when Pages moved to serving the `gh-pages` branch -- it now only
  # emits a `rustdoc` artifact, which gh-pages.yml grafts in at /api/. There is
  # no `with:` block for the same reason: that workflow takes no inputs any
  # more, and passing the old `dry-run` fails the run outright rather than being
  # ignored.
  #
  # Not gated on `should_publish`: a dry run is exactly when it is worth knowing
  # that the docs still build. `!= 'failure'` admits the skipped publish-crate,
  # and `!cancelled()` stops a cancelled run continuing.
  build-docs:
    name: Build Documentation
    needs: [validate, publish-crate]
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.publish-crate.result != 'failure'
    uses: ./.github/workflows/docs.yml
    # Reusable workflows receive no secrets unless passed. Without this the
    # app-token step sees an empty PRIVATE_KEY; `continue-on-error` keeps the
    # job alive on `github.token`, so the loss would be silent rather than loud.
    secrets: inherit

  summary:
    name: Publication Summary
    needs: [validate, publish-crate, build-docs]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CRATE_RESULT: ${{ needs.publish-crate.result }}
          DOCS_RESULT: ${{ needs.build-docs.result }}
          REPO_OWNER: ${{ github.repository_owner }}
          # Same derivation the publish jobs use, rather than a third hardcoded
          # `rust-yaml` in the URLs below.
          CRATES_NAME: ${{ vars.CRATES_NAME || github.event.repository.name }}
        # A single grouped redirect rather than 26 individual ones (SC2129), with
        # $GITHUB_STEP_SUMMARY quoted (SC2086) and every workflow expression bound
        # through env: instead of spliced into the script text.
        run: |
          {
            echo "# 📦 Publication Summary"
            echo ""
            echo "**Version:** ${VERSION}"
            echo ""

            if [ "${CRATE_RESULT}" = "success" ]; then
              echo "✅ **crates.io:** Successfully published"
              echo "   - View: https://crates.io/crates/${CRATES_NAME}/${VERSION}"
            elif [ "${CRATE_RESULT}" = "skipped" ]; then
              echo "⏭️ **crates.io:** Skipped (dry run or already published)"
            else
              echo "❌ **crates.io:** Failed or not completed"
            fi
            echo ""

            # "built", not "published". This workflow stopped deploying anything
            # when docs.yml became an artifact producer; the site is published by
            # gh-pages.yml from publish.yml. Claiming a Pages publish here sent
            # readers to a URL this run never touched.
            if [ "${DOCS_RESULT}" = "success" ]; then
              echo "✅ **API documentation:** Built (artifact \`rustdoc\`)"
              echo "   - docs.rs builds the published crate independently:"
              echo "     https://docs.rs/${CRATES_NAME}/${VERSION}"
            elif [ "${DOCS_RESULT}" = "skipped" ]; then
              echo "⏭️ **API documentation:** Skipped"
            else
              echo "❌ **API documentation:** Failed or not completed"
            fi
            echo ""

            echo "## Next Steps"
            echo ""
            echo "1. Verify the crate at: https://crates.io/crates/rust-yaml"
            echo "2. Check documentation at: https://docs.rs/rust-yaml"
            echo "3. Create release notes if not already done"
            echo "4. Announce the release"
          } >> "$GITHUB_STEP_SUMMARY"
