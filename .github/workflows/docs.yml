name: API Documentation

on:
  # Callable so gh-pages.yml's caller can order this ahead of the site build and
  # reuse the artifact. No `dry-run` input: this workflow publishes nothing, so
  # there is no deployment to suppress.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the ref, not on "pages": this no longer contends for the Pages
# deployment, it just should not build the same ref twice at once.
concurrency:
  group: api-docs-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # `contents: read` only -- this job checks out, compiles docs and uploads an
    # artifact. It touches no Pages API, so the write scopes it used to request
    # were unnecessary once the deploy job went away.
    permissions:
      contents: read
    steps:
      # `continue-on-error` is what makes the `|| github.token` fallback below
      # reachable at all. Without it, a missing or rotated app credential aborts
      # the job before checkout runs, so that `||` can only ever rescue an empty
      # output -- never a failed step. Deliberately degrading here is safe:
      # nothing in this workflow needs elevated rights. The checkout is
      # read-only, the one submodule (yaml/yaml-test-suite) is public, and Pages
      # is authorised by the `id-token`/`pages` permissions rather than by this
      # token. The app token is therefore an optimisation, never a requirement.
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use PR head SHA on pull_request events to avoid synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN || github.token }}
          submodules: true

      - name: GitHub Actions Bot Setup
        uses: ./.github/actions/bot-setup

      - name: Install Rust toolchain
        uses: elioseverojunior/rust-toolchain@365ab4286518f5f3d13c12ed638024bdc86f413b # v0.3.0-1

      # No JS runtime here on purpose: this workflow builds rustdoc and nothing
      # else. The VitePress site under docs/ has its own workflow, which owns bun.
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Build rustdoc
        run: |
          chmod +x .github/scripts/create-docs-pages.sh
          .github/scripts/create-docs-pages.sh

      # A plain artifact, NOT upload-pages-artifact. This workflow no longer
      # publishes anything: Pages serves the `gh-pages` branch, which gh-pages.yml
      # writes. rustdoc is handed over as an artifact so that workflow can drop it
      # at /api/ inside the site without running `cargo doc` a second time.
      #
      # Building it twice is not merely slower -- two builds can see two
      # checkouts, so the API pages could describe a different commit than the
      # site around them. One build, consumed once, makes that impossible.
      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdoc
          path: target/doc
          retention-days: 7
          if-no-files-found: error
