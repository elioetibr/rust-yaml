name: Cargo Cache Warmup

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  id-token: write
  pages: write
  pull-requests: write

jobs:
  warmup-cache:
    name: Warm up Cargo cache (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64/x86_64 platforms
          - os: ubuntu-latest
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-2025
            arch: x86_64
            rust-target: x86_64-pc-windows-msvc
          - os: macos-15
            arch: x86_64
            rust-target: x86_64-apple-darwin
          # ARM64/aarch64 platforms
          - os: ubuntu-latest
            arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
          - os: macos-15
            arch: aarch64
            rust-target: aarch64-apple-darwin
    steps:
      - name: Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use PR head SHA on pull_request events to avoid synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token || github.token }}
          submodules: true

      - name: GitHub Actions Bot Setup
        uses: ./.github/actions/bot-setup

      - name: Install Rust toolchain
        uses: elioseverojunior/rust-toolchain@365ab4286518f5f3d13c12ed638024bdc86f413b # v0.3.0-1
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          version: 1.0

      - name: Configure ARM64 cross-compile env
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        run: |  # pragma: allowlist secret
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.os }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-cargo-registry-
            ${{ matrix.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ matrix.os }}-${{ matrix.arch }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ matrix.os }}-${{ matrix.arch }}-cargo-build-
            ${{ matrix.os }}-cargo-build-

      - name: Download dependencies
        run: cargo fetch

      - name: Build project
        run: cargo build --target ${{ matrix.rust-target }} --all-features

      - name: Build tests
        run: cargo test --target ${{ matrix.rust-target }} --no-run --all-features

      - name: Build benchmarks
        run: cargo bench --target ${{ matrix.rust-target }} --no-run --all-features || true

      - name: Build documentation
        run: cargo doc --target ${{ matrix.rust-target }} --no-deps --all-features

      - name: Run clippy
        run: cargo clippy --target ${{ matrix.rust-target }} --all-features --all-targets -- -D warnings || true

      - name: Check formatting
        run: cargo fmt -- --check || true

      - name: Install cargo-nextest
        if: matrix.arch == 'x86_64' # Only install on native architectures
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest
        continue-on-error: true

      - name: Build with nextest
        if: matrix.arch == 'x86_64' # Only run on native architectures
        run: cargo nextest run --target ${{ matrix.rust-target }} --no-run --all-features || true
        continue-on-error: true

      - name: Summary
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_TARGET: ${{ matrix.rust-target }}
        # One grouped redirect rather than 17 individual ones (SC2129), with
        # $GITHUB_STEP_SUMMARY quoted (SC2086). Grouping also fixes a real bug:
        # in `du -sh ... || echo "N/A" >> $GITHUB_STEP_SUMMARY` the redirect binds
        # only to the fallback echo, so the du output itself went to stdout and
        # never reached the summary. Inside the block both are captured.
        run: |
          {
            echo "## Cache Warmup Complete"
            echo ""
            echo "**Platform:** ${MATRIX_OS} / ${MATRIX_ARCH}"
            echo "**Target:** ${MATRIX_TARGET}"
            echo ""
            echo "✅ Cargo registry cached"
            echo "✅ Dependencies downloaded"
            echo "✅ Project built for target ${MATRIX_TARGET}"
            echo "✅ Tests compiled"
            echo "✅ Documentation generated"
            echo ""
            echo "Cache size details:"
            echo '```'
            du -sh ~/.cargo/registry/ 2>/dev/null || echo "Registry: N/A"
            du -sh ~/.cargo/git/ 2>/dev/null || echo "Git: N/A"
            du -sh target/ 2>/dev/null || echo "Target: N/A"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
