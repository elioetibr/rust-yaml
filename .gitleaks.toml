# gitleaks configuration.
#
# Extends the built-in ruleset and excludes the generated ncc bundle from
# scanning. `dist/` is a minified bundle of third-party dependencies, committed
# because JavaScript GitHub Actions must ship their build output. Bundled
# library docstrings contain example tokens — e.g. @actions/core's `setSecret`
# JSDoc `const apiToken = "abc123xyz456"` — that trip the `generic-api-key`
# rule as false positives. The hand-written source under `src/` is still fully
# scanned by the default rules.
title = "docker-tag-generator-action"

[extend]
useDefault = true

[allowlist]
description = "Machine-generated build output — never source, and a reliable false-positive generator"
# Path exclusion is carried by .gitignore, NOT by this list: `gitleaks dir`
# walks the tree gitignore-aware, so an ignored directory is never read at all.
# That distinction is worth the comment — compiled .o files under a checked-out
# worktree (.claude/worktrees/<branch>/target/) carry high-entropy mangled Rust
# symbols that gitleaks reports as `generic-api-key`, and two of them blocked a
# commit here. Ignoring `.claude/` took the scan from 1.42 GB / 4m48s / 2 false
# positives to 14.5 MB / 16s / 0. Adding those paths below instead would still
# have read all 1.42 GB before discarding the findings.
paths = ['''^target/''']
